name: Test Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # LINT / UNIT TESTS / BUILD
  # ============================================================

  lint:
    name: Lint, Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Audit dependencies
        run: npm run audit:ci


  # ============================================================
  # PLAYWRIGHT E2E TESTS
  # ============================================================

  test:
    name: E2E Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint

    strategy:
      fail-fast: false

      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright shard
        env:
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}
        run: |
          npm run test:e2e:ci -- --shard=${{ matrix.shard }}/2

      - name: Check blob report
        if: always()
        run: |
          echo "Checking Playwright blob report..."

          if [ -d "blob-report" ]; then
            echo "blob-report directory exists."
            find blob-report -maxdepth 2 -type f -print || true
          else
            echo "WARNING: blob-report directory does not exist."
          fi

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics and JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14


  # ============================================================
  # ANDROID
  # ============================================================

  android:
    name: Android Unit Test & Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build and sync web assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Run Android tests and build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flexiorder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  # ============================================================
  # BURN-IN / FLAKY TEST DETECTION
  # ============================================================

  burn-in:
    name: Burn-In (Flaky Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test

    if: github.event_name == 'pull_request' || github.event_name == 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run burn-in suite
        env:
          PLAYWRIGHT_SHARD: burn-in
        run: |
          npm run test:e2e:ci -- --repeat-each=10

      - name: Upload burn-in blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-burn-in-blob
          path: blob-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload burn-in failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-failures
          path: |
            blob-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30


  # ============================================================
  # FINAL REPORT
  # ============================================================

  report:
    name: Test Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - lint
      - test
      - android
      - burn-in

    if: always()

    steps:

      # ----------------------------------------------------------
      # WORKFLOW SUMMARY
      # ----------------------------------------------------------

      - name: Write workflow summary
        env:
          QUALITY_RESULT: ${{ needs.lint.result }}
          E2E_RESULT: ${{ needs.test.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          BURN_IN_RESULT: ${{ needs.burn-in.result }}

        run: |
          {
            echo "## FlexiOrder quality summary"
            echo
            echo "- Lint, unit tests and build: **$QUALITY_RESULT**"
            echo "- Playwright E2E shards: **$E2E_RESULT**"
            echo "- Android tests and APK: **$ANDROID_RESULT**"
            echo "- Burn-in: **$BURN_IN_RESULT**"
            echo "- Browser projects: mobile Chromium and desktop Chromium"
            echo "- Shards: 2"
          } >> "$GITHUB_STEP_SUMMARY"


      # ----------------------------------------------------------
      # DOWNLOAD PLAYWRIGHT BLOB REPORTS
      # ----------------------------------------------------------

      - name: Download Playwright blob reports
        id: download-reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true


      # ----------------------------------------------------------
      # CHECK WHETHER REPORTS EXIST
      # ----------------------------------------------------------

      - name: Detect Playwright reports
        id: reports
        run: |
          echo "=========================================="
          echo "Checking Playwright blob reports"
          echo "=========================================="

          if [ -d "all-blob-reports" ]; then
            echo "Directory exists:"
            ls -la all-blob-reports || true
          else
            echo "Directory does not exist."
          fi

          if [ -d "all-blob-reports" ] && \
             find all-blob-reports -type f -name '*.zip' -print -quit | grep -q .; then

            echo "Playwright blob reports found."
            echo "found=true" >> "$GITHUB_OUTPUT"

            echo "Files:"
            find all-blob-reports -type f -print

          else

            echo "No Playwright blob reports found."
            echo "found=false" >> "$GITHUB_OUTPUT"

          fi


      # ----------------------------------------------------------
      # CHECKOUT ONLY IF REPORT EXISTS
      # ----------------------------------------------------------

      - name: Check out repository
        if: steps.reports.outputs.found == 'true'
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # NODE ONLY IF REPORT EXISTS
      # ----------------------------------------------------------

      - name: Set up Node.js
        if: steps.reports.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm


      # ----------------------------------------------------------
      # INSTALL PLAYWRIGHT
      # ----------------------------------------------------------

      - name: Install dependencies
        if: steps.reports.outputs.found == 'true'
        run: npm ci


      # ----------------------------------------------------------
      # MERGE PLAYWRIGHT REPORTS
      # ----------------------------------------------------------

      - name: Merge Playwright reports
        if: steps.reports.outputs.found == 'true'
        run: |
          echo "Merging Playwright blob reports..."

          npx playwright merge-reports \
            --reporter html \
            ./all-blob-reports


      # ----------------------------------------------------------
      # UPLOAD HTML REPORT
      # ----------------------------------------------------------

      - name: Upload merged HTML report
        if: steps.reports.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 30


      # ----------------------------------------------------------
      # NO REPORT MESSAGE
      # ----------------------------------------------------------

      - name: No Playwright report available
        if: steps.reports.outputs.found != 'true'
        run: |
          echo "=========================================="
          echo "No Playwright blob reports were available."
          echo "Skipping HTML report generation."
          echo "=========================================="