name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Audit dependencies
        run: npm run audit:ci

  test:
    name: E2E Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright shard
        env:
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}
        run: npm run test:e2e:ci -- --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics and JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android Unit Test & Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build and sync web assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Run Android tests and build APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flexiorder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  burn-in:
    name: Burn-In (Flaky Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run burn-in suite
        run: |
          npm run test:e2e:ci -- --repeat-each=10

      - name: Upload burn-in failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-failures
          path: |
            blob-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Test Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, android, burn-in]
    if: always()

    steps:
      - name: Write workflow summary
        env:
          QUALITY_RESULT: ${{ needs.lint.result }}
          E2E_RESULT: ${{ needs.test.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          BURN_IN_RESULT: ${{ needs.burn-in.result }}
        run: |
          {
            echo "## FlexiOrder quality summary"
            echo
            echo "- Lint, unit tests and build: **$QUALITY_RESULT**"
            echo "- Playwright E2E shards: **$E2E_RESULT**"
            echo "- Android tests and APK: **$ANDROID_RESULT**"
            echo "- Burn-in: **$BURN_IN_RESULT**"
            echo "- Browser projects: mobile Chromium and desktop Chromium"
            echo "- Shards: 2"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download shard reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Detect downloaded reports
        id: reports
        run: |
          if find all-blob-reports -name '*.zip' -print -quit 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.reports.outputs.found == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.reports.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.reports.outputs.found == 'true'
        run: npm ci

      - name: Merge Playwright reports
        if: steps.reports.outputs.found == 'true'
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        if: steps.reports.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 30
